<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" width="1024" height="768">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08284d" />
      <stop offset="60%" stop-color="#00458b" />
      <stop offset="100%" stop-color="#051830" />
    </linearGradient>
    <radialGradient id="glow" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#f37021" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#08284d" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.07" />
    </pattern>
  </defs>

  <rect width="1024" height="768" fill="url(#bg)" />
  <rect width="1024" height="768" fill="url(#glow)" />
