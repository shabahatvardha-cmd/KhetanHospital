    <circle r="153.60000000000002" fill="none" stroke="#ffffff" stroke-width="3" />
    <path d="M -115.19999999999999 0 L 115.19999999999999 0 M 0 -115.19999999999999 L 0 115.19999999999999" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Doctor Silhouette / Medical Caduceus Icon -->
