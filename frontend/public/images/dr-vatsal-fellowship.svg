  <text x="512" y="537.5999999999999" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="34.56" font-weight="800" fill="#ffffff" letter-spacing="-0.5">Wrightington UK Fellowship</text>
  <text x="512" y="583.6800000000001" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="18.432000000000002" font-weight="500" fill="#c3d8ec">International Sports Medicine & Arthroplasty Training</text>

